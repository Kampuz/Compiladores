<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compiladores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="calculadora.html">Calculadora</a><br>

    <input type="file" class="input" placeholder="Selecionar arquivo" accept=".txt">

    <button onclick="cleanInput()">Novo</button>
    <button onclick="abrir()">Abrir</button>
    <button onclick="salvar()">Salvar</button>

    <textarea id="code-input"></textarea>

    <button onclick="tokenize()">Analíse Léxica</button>

    <table id="token-output">
        <tr>
            <th>Lexema</th>
            <th>Token</th>
            <th>Linha</th>
            <th>Coluna Inicial</th>
            <th>Coluna Final</th>
        </tr>
    </table>

    <table id="error-output">
        <tr>
            <th>Erro</th>
            <th>Token</th>
            <th>Linha</th>
            <th>Coluna Inicial</th>
            <th>Coluna Final</th>
        </tr>
    </table>

    <script src="js/checkers.js"></script>
    <script src="js/extra.js"></script>
    <script src="js/pascal.js"></script>
</body>
</html>
