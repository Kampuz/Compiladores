<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compiladores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header clas="toolbar">
        <button onclick="goTo('calculadora.html')">Calculadora</button>
        <button onclick="cleanInput()">Novo</button>
        
        <button onclick="openFile('file-input')">Abrir</button>
        <button onclick="saveFile('code-input')">Salvar</button>
        
        <button onclick="compile('code-input', 'token-output', 'error-output', 'sintaticalErrorOutput', 'sintaticalErrorTable')">Compilar</button>
    </header>
    <main>

        <input type="file" id="file-input" hidden accept=".txt">
        <textarea id="code-input" placeholder="Digite seu código aqui..." rows="15" cols="80"></textarea>
        
        <section class="ouputs">
            <h3>Tabela de Tokens</h3>
            <table id="token-output", border="1">
                <thead>
                    <tr>
                        <th>Lexema</th>
                        <th>Token</th>
                        <th>Linha</th>
                        <th>Coluna Inicial</th>
                        <th>Coluna Final</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            
            <h3>Erros Léxicos</h3>
            <table id="error-output" border="1">
                <thead>

                    <tr>
                        <th>Erro</th>
                        <th>Token</th>
                        <th>Linha</th>
                        <th>Coluna Inicial</th>
                        <th>Coluna Final</th>
                    </tr> 
                </thead>
            </table>
    
            <h3>Erros Sintáticos</h3>
            <table id="sintaticalErrorTable" border="1">
                <thead>
                    <tr>
                        <th>Esperado</th>
                        <th>Encontrado</th>
                         <th>Tipo</th>
                        <th>Linha</th>
                        <th>Coluna</th>
                    </tr>
                </thead> 
                <tbody></tbody>
            </table>
        </section>
    </main>
    
    <script src="js/checkers.js"></script>
    <script src="js/compileLogic.js"></script>
    <script src="js/fileHandlers.js"></script>
    <script src="js/lexicalAnalyzer.js"></script>
    <script src="js/syntaticAnalyzer.js"></script>
    <script src="js/tokens.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
