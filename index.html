<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compiladores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button onclick="goTo('calculadora.html')">Calculadora</button><br>
    
    <button onclick="cleanInput()">Novo</button>
    <button onclick="openFile('file-input', 'code-input')">Abrir</button>
    <button onclick="saveFile('code-input')">Salvar</button>
    
    <input type="file" id="file-input" class="input" hidden accept=".txt">
    <textarea id="code-input"></textarea>

    <button onclick="callLexicalAnalysis('token-output', 'error-output', 'code-input')">Analíse Léxica</button>
    <button onclick="callSyntaticAnalysis('token-output', 'error-output', 'code-input')">Analíse Sintática</button>
    <button onclick="compilar()">Compilar</button>

    <table id="token-output">
        <tr>
            <th>Lexema</th>
            <th>Token</th>
            <th>Linha</th>
            <th>Coluna Inicial</th>
            <th>Coluna Final</th>
        </tr>
    </table>

    <table id="error-output">
        <tr>
            <th>Erro</th>
            <th>Token</th>
            <th>Linha</th>
            <th>Coluna Inicial</th>
            <th>Coluna Final</th>
        </tr>
    </table>

    <table id="sintaticalErrorTable">
        <thead>
            <tr>
                <th>Esperado</th>
                <th>Encontrado</th>
                <th>Tipo</th>
                <th>Linha</th>
                <th>Coluna</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="js/checkers.js"></script>
    <script src="js/inputOutput.js"></script>
    <script src="js/lexicalAnalyzer.js"></script>
    <script src="js/syntaticAnalyzer.js"></script>
    <script src="js/tokens.js"></script>
</body>
</html>
